services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/root/data
      - ./backend/gitpatrol.db:/root/gitpatrol.db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
